serve:
  host: "127.0.0.1"
  port: 18993
  show_model_prefix: false

router:
  strategy: random

memory:
  enabled: false

media:
  enabled: false

llms:
  mock-model:
    description: "Local mock used by the Codex transport smoke test"
    provider: mock
    model: mock-backend
    base_url: http://127.0.0.1:18992/v1
    auth_mode: none
    local: true
    max_tokens: 4096
    context_limit: 131072
